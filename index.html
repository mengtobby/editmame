    <!--
      THESIS: replace dense pro-NLE dark chrome with the calm, task-first legibility of a
      shared document — video editing that feels as approachable as editing a Google Doc together.
      OWN-WORLD: Google Docs' own visual system — white/light-gray canvas, Roboto, #1a73e8 blue
      actions, #dadce0 hairline borders, circular peer avatars, icon-toolbar rows, a "page"
      floating on gray chrome.
      STORY: a visitor opens a room, sees their name and a collaborator's avatar up top like a
      shared doc, imports a clip, and watches a collaborator's edit appear live — never doubting
      where their footage lives.
      FIRST VIEWPORT: light-gray app shell; white title bar with editable project name, peer
      avatars, and a blue Share button; white preview "page" card with an icon toolbar beneath;
      light timeline; white right rail listing peers plainly.
      FORM: brief-pinned world (Google Docs) — the user named the reference directly, so no
      concept-seed roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->

    <script type="module" src="/src/main.tsx"></script>
